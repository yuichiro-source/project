<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG自己分析</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>MTG自己分析</h1>
  <nav class="tabs">
    <a href="#meetings" data-tab="meetings">MTG分析</a>
    <a href="#questions" data-tab="questions">よく出る質問</a>
  </nav>
  <div class="kpis" id="kpis"></div>
  <label class="self">自分 <input id="selfName" placeholder="話者名" size="6"></label>
  <label class="self">上長 <input id="bossName" placeholder="話者名" size="6"></label>
</header>

<main id="view-meetings">
  <section class="left">
    <form id="form" class="card">
      <div class="row">
        <input name="client" id="client" placeholder="クライアント名 *" list="clients" required autocomplete="off">
        <datalist id="clients"></datalist>
        <input name="date" type="date" id="date">
      </div>
      <div class="row">
        <div class="seg" id="typeSeg">
          <label><input type="radio" name="type" value="オリエン" checked><span>オリエン</span></label>
          <label><input type="radio" name="type" value="中間"><span>中間</span></label>
          <label><input type="radio" name="type" value="プレゼン"><span>プレゼン</span></label>
          <label><input type="radio" name="type" value="その他"><span>その他</span></label>
        </div>
        <input name="title" id="title" placeholder="案件名（任意）" list="titles" autocomplete="off">
        <datalist id="titles"></datalist>
      </div>
      <div class="row">
        <div class="seg small" id="srcSeg">
          <label><input type="radio" name="src" value="text" checked><span>テキスト</span></label>
          <label><input type="radio" name="src" value="gdoc"><span>Googleドキュメント</span></label>
        </div>
      </div>
      <textarea name="text" id="text" rows="5" placeholder="文字起こしを貼り付け"></textarea>
      <input name="docUrl" id="docUrl" class="hidden" placeholder="https://docs.google.com/document/d/...（リンク共有で閲覧可にしてください）">
      <div class="row end">
        <span id="formMsg" class="msg"></span>
        <button type="submit" id="submitBtn">分析する</button>
      </div>
    </form>

    <div class="card list">
      <table>
        <thead><tr><th>案件 / MTG</th><th>種別</th><th class="num">点</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="muted hidden">まだMTGがありません。上のフォームから文字起こしを分析してください。</p>
    </div>

    <div class="card" id="issuesCard">
      <h3>よくあるミス</h3>
      <ul id="issues" class="issues"></ul>
    </div>
  </section>

  <section class="right card" id="detail">
    <p class="muted">左の一覧からMTGを選択すると分析結果を表示します。</p>
  </section>
</main>

<main id="view-questions" class="single hidden">
  <section class="card">
    <div class="row q-head">
      <h2>上長がよくする質問</h2>
      <div class="seg small" id="qTypeSeg">
        <label><input type="radio" name="qType" value="" checked><span>全種別</span></label>
        <label><input type="radio" name="qType" value="オリエン"><span>オリエン</span></label>
        <label><input type="radio" name="qType" value="中間"><span>中間</span></label>
        <label><input type="radio" name="qType" value="プレゼン"><span>プレゼン</span></label>
        <label><input type="radio" name="qType" value="その他"><span>その他</span></label>
      </div>
    </div>
    <p class="muted small-note">上長がサポートでお客様に質問した内容を種類ごとに集計しています。回数が多いものほど、次回から自分で聞けるようにしておきたい質問です。</p>
    <div id="qList"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
